name: Deploy AssetManager WMS

on:
  push:
    branches: [main]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          VITE_API_URL=http://94.199.19.7:84/api-asset npm run build -- --base=/asset/

      - name: Copy Frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 94.199.19.7
          port: 22222
          username: strustam
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "frontend/dist/*"
          target: "/var/www/assetmanager"
          strip_components: 2

  deploy-backend:
    runs-on: ubuntu-latest
    needs: deploy-frontend
    steps:
      - uses: actions/checkout@v3

      - name: Deploy Backend
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: 94.199.19.7
          port: 22222
          username: strustam
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd ~/apps/assetmanager/diploma-work-main/backend
            git fetch origin main
            git reset --hard origin/main
            pip install -r requirements.txt --break-system-packages
            echo "${{ secrets.SUDO_PASSWORD }}" | sudo -S systemctl restart assetmanager